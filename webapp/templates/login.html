{% extends "base.html" %}
{% block title %}Login — MediSense AI{% endblock %}

{% block content %}
<div class="container">
    <div class="card auth-card">
        <div class="card-header">
            <i class="bi bi-heart-pulse-fill fs-1 d-block mb-2"></i>
            <h3 class="mb-0">Welcome Back</h3>
            <p class="mb-0 mt-1 opacity-75">Log in to your account</p>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                </button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="{{ url_for('signup') }}" class="text-decoration-none fw-bold">Sign Up Free</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

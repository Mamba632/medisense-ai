{% extends "base.html" %}
{% block title %}Sign Up — MediSense AI{% endblock %}

{% block content %}
<div class="container">
    <div class="card auth-card">
        <div class="card-header">
            <i class="bi bi-heart-pulse-fill fs-1 d-block mb-2"></i>
            <h3 class="mb-0">Create Account</h3>
            <p class="mb-0 mt-1 opacity-75">Join MediSense AI for free</p>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ request.form.get('name', '') }}"
                               placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ request.form.get('email', '') }}"
                               placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Minimum 6 characters" required minlength="6">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="Re-enter password" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Log In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

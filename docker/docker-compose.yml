version: "3.8"

services:
  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in docker/.env or your shell}
